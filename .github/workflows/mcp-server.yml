name: MCP Server CI/CD

on:
  push:
    branches: [main]
    paths:
      - "mcp-server/**"
      - "bcb-rc-*/**"
      - ".github/workflows/mcp-server.yml"
  pull_request:
    branches: [main]
    paths:
      - "mcp-server/**"

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: mcp-server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint (typecheck)
        run: npm run typecheck
        continue-on-error: true

      - name: Unit tests
        run: npm test
        continue-on-error: true

      - name: npm audit
        run: npm audit --audit-level=high || true
        continue-on-error: true

      - name: Semgrep
        uses: docker://semgrep/semgrep:latest
        continue-on-error: true
        with:
          args: semgrep --config=auto --error --quiet /github/workspace/mcp-server

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: mcp-server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/mcp-server:latest
            ghcr.io/${{ github.repository }}/mcp-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan image
        uses: aquasecurity/trivy-action@0.29.0
        continue-on-error: true
        with:
          image-ref: ghcr.io/${{ github.repository }}/mcp-server:${{ github.sha }}
          format: table
          exit-code: 1
