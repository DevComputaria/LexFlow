texto_original: "A alteracao do nome empresarial, se consistir na unica alteracao necessaria para adequacao ao disposto nesta Resolucao Conjunta, deve: I - ser efetuada no prazo de um ano, contado a partir da data da entrada em vigor desta Resolucao Conjunta."
