texto_original: "As instituicoes financeiras, as instituicoes de pagamento e as demais instituicoes autorizadas a funcionar pelo Banco Central do Brasil, na condicao de prestadoras de servicos de BaaS e de entidades tomadoras de servicos de BaaS, devem instituir mecanismos de acompanhamento e de controle com vistas a assegurar a efetividade do cumprimento do disposto nesta Resolucao Conjunta, incluindo: I - a definicao de processos, testes e trilhas de auditoria; II - a definicao de metricas e indicadores adequados; e III - a identificacao e a correcao de eventuais deficiencias."
