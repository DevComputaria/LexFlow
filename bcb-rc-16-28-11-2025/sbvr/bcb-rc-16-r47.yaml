artigo: Art. 8o, paragrafo 6o, inciso I, alineas a e b, itens 1 e 2.
modalidade: obrigado
regra_sbvr: "E obrigatorio que contrato preveja, em regime de resolucao da prestadora, acesso pleno do responsavel ao acervo contratual/informacional e notificacao previa de interrupcao com antecedencia minima de 30 dias, incluindo possibilidade de prazo adicional de 30 dias e aplicacao tambem quando houver inadimplemento de remuneracao."
